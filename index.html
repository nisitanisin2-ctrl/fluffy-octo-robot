<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>現場経路作成アプリ</title>
<meta name="description" content="地図のスクリーンショットに赤い矢印で経路を描き、写真を差し込んで現場までの道順図を作るアプリ">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="現場経路">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:"Segoe UI","Meiryo",system-ui,sans-serif;background:#4a4f57;font-size:14px}
#toolbar{background:#fff;border-bottom:1px solid #ccc;padding:5px 7px;display:flex;flex-direction:column;gap:5px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.grp{display:flex;align-items:center;gap:4px;background:#f2f4f7;border:1px solid #e2e6eb;border-radius:9px;padding:3px 6px}
.grp>.lbl{font-size:11px;color:#78808d;white-space:nowrap;margin-right:2px}
button{font:inherit;padding:6px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer;white-space:nowrap}
button:hover{background:#e9edf2}
button:disabled{opacity:.45;cursor:default;background:#fff}
.grp button{padding:4px 7px}
button.tool.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
button.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}
button.primary:hover{background:#1765cc}
#siteName{font:inherit;padding:5px 8px;border:1px solid #bbb;border-radius:6px;width:200px}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;outline:1px solid #999;cursor:pointer;padding:0}
.swatch.active{outline:3px solid #1a73e8}
.grp select{padding:4px}
select,textarea,input[type=range]{font:inherit;padding:5px;border:1px solid #bbb;border-radius:6px;background:#fff}
input[type=range]{padding:0}
/* 道具の説明。画面の一番下（フッターのすぐ上）に小さく出します */
#hint{flex:none;background:#fffbe6;border-top:1px solid #e8dfa8;color:#6b6000;padding:3px 12px;min-height:19px;font-size:11.5px;line-height:1.45}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;overflow:auto;position:relative;display:flex;align-items:flex-start;justify-content:center}
#cv{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.45);margin:12px}

#side{width:262px;flex:none;background:#fff;border-left:1px solid #ccc;display:flex;flex-direction:column;overflow:hidden}
.sec{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid #e4e4e4}
.sec:last-child{border-bottom:none}
.secHead{padding:8px 10px 6px;font-weight:bold;background:#f7f8fa}
.row{display:flex;align-items:center;gap:6px;padding:0 10px 8px;font-size:13px;color:#444}
.row select,.row input[type=range]{flex:1;min-width:0}
.btnRow{display:flex;gap:6px;padding:0 10px 8px}
.btnRow button{flex:1;padding:6px 4px;font-size:13px}
.note{padding:0 10px 8px;font-size:12px;color:#555;line-height:1.7}
.note b{color:#1a5fb4}
.note kbd{background:#39465a;color:#fff;border-radius:4px;padding:1px 5px;font-size:11px;font-family:inherit}
#dropZone{margin:10px;padding:12px 8px;border:2px dashed #bbb;border-radius:10px;text-align:center;color:#666;cursor:pointer;line-height:1.7;background:#fafafa}
#dropZone.armed{border-color:#1a73e8;background:#eaf2fe;color:#14488f}
#dropZone kbd{background:#333;color:#fff;border-radius:4px;padding:1px 6px;font-size:12px}
#btnPhotoFile{margin:0 10px 8px}
#trayList{flex:1;overflow-y:auto;padding:0 10px 10px;min-height:56px}
.titem{position:relative;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;overflow:hidden;cursor:pointer;background:#fdfdfd}
.titem:hover{border-color:#1a73e8;box-shadow:0 0 0 2px rgba(26,115,232,.25)}
.titem img{display:block;width:100%;height:auto}
.titem .cap{font-size:12px;color:#555;padding:3px 6px;background:#f4f4f4}
.titem .del{position:absolute;top:4px;right:4px;width:22px;height:22px;line-height:1;padding:0;border-radius:50%;background:rgba(255,255,255,.9)}
#footText{margin:0 10px 8px;resize:vertical;height:70px}
#btnArrange{margin:0 10px 10px}
footer{flex:none;background:#3a3e45;color:#bbb;font-size:12px;padding:4px 12px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
footer .note2{min-width:0}
#ver{flex:none;margin-left:auto;color:#96a0ad;white-space:nowrap;letter-spacing:.02em}
@media print{
  #toolbar,#hint,footer,#side{display:none!important}
  html,body{margin:0;padding:0;height:auto;background:#fff;display:block}
  #main,#stage{display:block;margin:0;padding:0;overflow:visible}
  #cv{width:100%!important;height:auto!important;box-shadow:none;margin:0;display:block}
}
</style>
</head>
<body>
<div id="toolbar">
  <div class="bar">
    <div class="grp">
      <span class="lbl">現場名</span>
      <input id="siteName" placeholder="用紙の上に印刷されます">
    </div>
    <div class="grp">
      <span class="lbl">ファイル</span>
      <button id="btnMap" class="primary">🗺 地図を読み込む</button>
      <button id="btnOpen">📂 開く</button>
      <button id="btnSaveProj">💾 保存</button>
    </div>
    <div class="grp">
      <span class="lbl">仕上げ</span>
      <button id="btnPng">⬇ 画像で保存</button>
      <button id="btnPrint">🖨 印刷</button>
    </div>
    <div class="grp">
      <span class="lbl">画面の表示</span>
      <button id="btnZoomOut" title="縮小">−</button>
      <button id="btnZoomIn" title="拡大">＋</button>
      <button id="btnFit">全体</button>
    </div>
    <div class="grp" id="grpInstall" hidden>
      <span class="lbl">アプリ</span>
      <button id="btnInstall" class="primary" title="このパソコンにインストールします。デスクトップのアイコンから、ブラウザを開かずに使えるようになります">💻 パソコンに入れる</button>
    </div>
  </div>
  <div class="bar">
    <div class="grp">
      <span class="lbl">道具</span>
      <button class="tool active" data-tool="select">🖱 選択</button>
      <button class="tool" data-tool="arrow">➜ 矢印</button>
      <button class="tool" data-tool="line" title="矢印の付かない線を引きます（区域の境目・う回路・敷地の区切りなど）">─ 罫線</button>
      <select id="dashSel" title="罫線の種類を選びます（実線・破線・点線・鎖線）">
        <option value="solid" selected>実線</option>
        <option value="dash">破線</option>
        <option value="longdash">長い破線</option>
        <option value="dot">点線</option>
        <option value="dashdot">一点鎖線</option>
        <option value="dashdotdot">二点鎖線</option>
      </select>
      <button class="tool" data-tool="pin">📍 番号</button>
      <button class="tool" data-tool="guard">👮 警備員</button>
      <button class="tool" data-tool="ellipse">◯ 丸</button>
      <button class="tool" data-tool="rect">□ 四角</button>
      <button class="tool" data-tool="text">✎ 文字</button>
    </div>
    <div class="grp">
      <span class="lbl">色</span>
      <button class="swatch active" data-color="#e60012" style="background:#e60012" title="赤"></button>
      <button class="swatch" data-color="#0068b7" style="background:#0068b7" title="青"></button>
      <button class="swatch" data-color="#00a040" style="background:#00a040" title="緑"></button>
      <button class="swatch" data-color="#f39800" style="background:#f39800" title="オレンジ"></button>
      <button class="swatch" data-color="#111111" style="background:#111111" title="黒"></button>
    </div>
    <div class="grp">
      <span class="lbl">太さ</span>
      <select id="thick" title="線・文字・ピンの大きさ">
        <option value="0.25">1 最も細い</option>
        <option value="0.35">2 とても細い</option>
        <option value="0.5">3 極細</option>
        <option value="0.75">4 細い</option>
        <option value="1" selected>5 標準</option>
        <option value="1.5">6 太い</option>
        <option value="2.2">7 極太</option>
      </select>
      <span class="lbl">濃さ</span>
      <select id="alpha" title="線・図形の透明度">
        <option value="1" selected>100%</option>
        <option value="0.85">85%</option>
        <option value="0.7">70%</option>
        <option value="0.55">55%</option>
        <option value="0.4">40%</option>
        <option value="0.25">25%</option>
      </select>
    </div>
    <div class="grp">
      <span class="lbl">編集</span>
      <button id="btnUndo" title="元に戻す（Ctrl+Z）">↩ 戻す</button>
      <button id="btnRedo" title="やり直す（Ctrl+Y）">↪ 進む</button>
      <button id="btnDel" title="選んだものを削除（Delete）">🗑 削除</button>
      <button id="btnClear">全消去</button>
    </div>
  </div>
</div>
<div id="main">
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside id="side">
    <div class="sec">
      <div class="secHead">📄 用紙と地図</div>
      <label class="row">用紙
        <select id="orient">
          <option value="landscape" selected>A4 横</option>
          <option value="portrait">A4 縦</option>
        </select>
      </label>
      <div class="row">
        <span style="width:58px">大きさ</span>
        <input type="range" id="mapZoom" min="20" max="400" step="1" value="100">
        <span id="mapZoomLabel" style="width:44px;text-align:right">100%</span>
      </div>
      <div class="btnRow">
        <button id="btnMapSmaller" title="地図を少し小さく">− 小さく</button>
        <button id="btnMapBigger" title="地図を少し大きく">＋ 大きく</button>
      </div>
      <div class="btnRow">
        <button id="btnFitContain" title="地図全体が枠に収まる大きさにします">枠に収める</button>
        <button id="btnFitCover" title="枠いっぱいに広げます（はみ出た分は切れます）">枠いっぱい</button>
      </div>
      <div class="btnRow">
        <button id="btnPickMap">✋ 地図をつかんで動かす</button>
      </div>
      <div class="note" id="mapNote">地図を読み込むと、ここで大きさを調整できます。</div>
    </div>
    <div class="sec" style="flex:1">
      <div class="secHead">🖼 差し込み用写真</div>
      <div id="dropZone">
        ここをクリックしてから<br><kbd>Ctrl</kbd>+<kbd>V</kbd> で写真を貼り付け<br>
        <small>（画像のドラッグ＆ドロップも可）</small>
      </div>
      <div class="note">ストリートビューなどの画面も、<kbd>Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> で範囲を切り取ってから貼り付けられます。</div>
      <button id="btnPhotoFile">📁 ファイルから追加</button>
      <label class="row">場所の示し方
        <select id="photoMode">
          <option value="num" selected>番号</option>
          <option value="callout">吹き出し</option>
        </select>
      </label>
      <div id="trayList"></div>
    </div>
    <div class="sec">
      <div class="secHead">📝 下のスペース</div>
      <label class="row">高さ
        <input type="range" id="footRange" min="0" max="120" step="1" value="45">
        <span id="footMMLabel" style="width:44px;text-align:right">45mm</span>
      </label>
      <label class="row">文字の大きさ
        <select id="footFont">
          <option value="1.9">小</option>
          <option value="2.5" selected>中</option>
          <option value="3.2">大</option>
        </select>
      </label>
      <textarea id="footText" placeholder="集合時間・注意事項・連絡先など"></textarea>
      <div class="note" id="capNote"></div>
      <button id="btnArrange">写真を下のスペースに並べる</button>
    </div>
  </aside>
</div>
<div id="hint"></div>
<footer>
  <span class="note2">地図画像は Googleマップ／Yahoo!地図 それぞれの利用規約の範囲内でご利用ください。青と橙の点線は画面上の目安で、印刷や画像保存には出ません。</span>
  <span id="ver"></span>
</footer>
<input type="file" id="fileMap" accept="image/*" hidden>
<input type="file" id="filePhoto" accept="image/*" multiple hidden>
<input type="file" id="fileProj" accept=".json,application/json" hidden>
<script>
'use strict';
/* ===== バージョン =====
   アプリを直したら、この2行を書き換えてください。
   画面右下に表示され、service-worker.js の CACHE 名とそろえておくと
   インストール済みの人にも確実に新しい版が届きます。 */
const APP_VERSION='1.3';
const APP_DATE='2026-07-28';

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
const hintEl=document.getElementById('hint');
const siteName=document.getElementById('siteName');
const thickSel=document.getElementById('thick');
const alphaSel=document.getElementById('alpha');
const dashSel=document.getElementById('dashSel');
const photoModeSel=document.getElementById('photoMode');
const orientSel=document.getElementById('orient');
const footRange=document.getElementById('footRange');
const footMMLabel=document.getElementById('footMMLabel');
const footFontSel=document.getElementById('footFont');
const footTextEl=document.getElementById('footText');
const capNote=document.getElementById('capNote');
const mapNote=document.getElementById('mapNote');
const dropZone=document.getElementById('dropZone');
const trayList=document.getElementById('trayList');
const fileMap=document.getElementById('fileMap');
const filePhoto=document.getElementById('filePhoto');
const fileProj=document.getElementById('fileProj');
const pageStyle=document.createElement('style'); document.head.appendChild(pageStyle);

const DPI=150, MM=DPI/25.4;          // 用紙は A4・150dpi で作る
let orient='landscape';
let footMM=45;                        // 下のスペースの高さ(mm)
let footText='';
let objects=[];                       // 先頭に地図(type:'map')を置く
let tray=[];
let undoStack=[], redoStack=[];
let tool='select';                    // 開いたときは「選択」から始める
let color='#e60012';
let base=11;
let userZoom=1, fitScale=1;
let drawing=null, cursorPos=null, selected=null;
let dragMode=null, dragStart=null, dragIndex=-1, resizeRef=null;
let preSnap=null, movedInDrag=false;
let tempShape=null, cascade=0, pasteTarget='map', exporting=false;

const HINTS={
 select:'書き込みをクリックで選択、ドラッグで移動。右下の□で大きさ変更。矢印は角の□で形を直せます。下スペースの境目は、中央のつまみを上下にドラッグしても変えられます。',
 arrow:'道に沿ってクリックで点を追加 → ダブルクリック（または右クリック／Enter）で矢印を確定。Escで中止。',
 line:'クリックで点を追加 → ダブルクリック（または右クリック／Enter）で線を確定。矢印の付かない線です。左の「線の種類」で実線・破線・点線などを選べます。Escで中止。',
 pin:'クリックした場所に番号ピン（1・2・3…）を置きます。',
 guard:'クリックした場所にガードマン（警備員）のピンを置きます。ダブルクリックで文字を変更できます。',
 ellipse:'目印にしたい場所をドラッグして丸で囲みます。',
 rect:'目印にしたい場所をドラッグして四角で囲みます。',
 text:'クリックした場所に文字を入れます。あとから移動・拡大縮小できます。'
};

/* ---------- 用紙の寸法 ---------- */
function pageWmm(){ return orient==='landscape'?297:210; }
function pageHmm(){ return orient==='landscape'?210:297; }
function footPx(){ return Math.round(footMM*MM); }
function headPx(){ return siteName.value.trim()?Math.round(12*MM):0; }
function mapRect(){
  const y=headPx();
  return {x:0,y:y,w:cv.width,h:Math.max(10,cv.height-y-footPx())};
}
function dividerY(){ return cv.height-footPx(); }
function tabRect(){
  const w=Math.max(60,MM*20), h=Math.max(14,MM*3.6);
  return {x:cv.width/2-w/2,y:dividerY()-h/2,w:w,h:h};
}
function getMap(){ for(const o of objects) if(o.type==='map')return o; return null; }

/* ---------- サイズ計算 ---------- */
function thickMul(){ return parseFloat(thickSel.value); }
function alphaVal(){ return parseFloat(alphaSel.value); }
function dashVal(){ return dashSel.value; }
/* 矢印と罫線は「クリックで点を置いていく」同じ操作なので、まとめて判定します */
function isPoly(t){ return t==='arrow'||t==='line'; }
/* 線の種類。線の太さ w に合わせて刻みも太さ相応にします */
function dashPattern(kind,w){
  switch(kind){
    case 'dash':       return [w*3.0,w*2.2];
    case 'longdash':   return [w*7.0,w*2.8];
    case 'dot':        return [w*0.05,w*2.0];
    case 'dashdot':    return [w*4.5,w*1.9,w*0.05,w*1.9];
    case 'dashdotdot': return [w*4.5,w*1.7,w*0.05,w*1.7,w*0.05,w*1.7];
    default:           return [];
  }
}
function lineW(o){ return Math.max(1,base*o.mul); }
function pinR(o){ return base*2.2*o.mul; }
function guardR(o){ return base*3.0*o.mul; }
function textSize(o){ return Math.max(7,base*3.2*o.mul); }
function setHint(msg){ hintEl.textContent=(msg!==undefined)?msg:(HINTS[tool]||''); }
function scaleNow(){ return fitScale*userZoom; }
function loadImage(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function fileToDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
function cloneObjects(){ return objects.map(o=>{ const c={...o}; if(o.points)c.points=o.points.map(p=>({x:p.x,y:p.y})); return c; }); }
function pushUndo(){ undoStack.push(cloneObjects()); if(undoStack.length>100)undoStack.shift(); redoStack.length=0; }
function undo(){ if(!undoStack.length)return; redoStack.push(cloneObjects()); objects=undoStack.pop(); selected=null; redraw(); }
function redo(){ if(!redoStack.length)return; undoStack.push(cloneObjects()); objects=redoStack.pop(); selected=null; redraw(); }
function toCanvas(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height}; }
function capturePointer(e){ try{cv.setPointerCapture(e.pointerId);}catch(err){} }
function nextNum(kind){ let m=0; for(const o of objects) if(o.type===kind&&o.num) m=Math.max(m,o.num); return m+1; }
function viewCenter(){
  const s=scaleNow(), r=cv.getBoundingClientRect();
  const off=Math.max(0,r.left-stage.getBoundingClientRect().left);
  const x=(stage.scrollLeft+stage.clientWidth/2-off)/s;
  const y=(stage.scrollTop+stage.clientHeight/2-12)/s;
  const m=mapRect();
  return {x:Math.min(Math.max(x,60),cv.width-60),y:Math.min(Math.max(y,m.y+60),cv.height-60)};
}

/* ---------- 用紙の作成 ---------- */
function updatePageStyle(){
  pageStyle.textContent='@page{size:A4 '+(orient==='landscape'?'landscape':'portrait')+';margin:0}';
}
function applyPageSize(){
  cv.width=Math.round(pageWmm()*MM);
  cv.height=Math.round(pageHmm()*MM);
  base=Math.max(5,Math.round(cv.width/160));
  footRange.max=Math.round(pageHmm()*0.6);
  if(footMM>footRange.max)footMM=parseFloat(footRange.max);
  footRange.value=footMM;
  updatePageStyle(); updateFootUI(); updateMapNote(); computeFit(); redraw();
}
function updateFootUI(){
  footMMLabel.textContent=Math.round(footMM)+'mm';
  const L=layoutFootText(), fh=footPx();
  if(fh<=0){ capNote.textContent='下のスペースなし（地図が用紙いっぱいになります）'; return; }
  const cap=Math.max(0,Math.floor((fh-L.pad)/L.lh));
  const restMM=Math.max(0,(fh-L.height)/MM);
  capNote.innerHTML='この高さに文言は <b>約'+cap+'行</b>（今 '+L.lines.length+'行）／'
    +'写真に使える高さ <b>約'+Math.round(restMM)+'mm</b>';
}

/* ---------- 地図 ---------- */
function fitMap(mode){
  const mo=getMap(); if(!mo)return;
  const r=mapRect(), iw=mo.img.naturalWidth, ih=mo.img.naturalHeight;
  const s=(mode==='cover')?Math.max(r.w/iw,r.h/ih):Math.min(r.w/iw,r.h/ih);
  mo.w=iw*s; mo.h=ih*s;
  mo.x=r.x+(r.w-mo.w)/2; mo.y=r.y+(r.h-mo.h)/2;
}
async function setMapFromSrc(src,keepObjects){
  const im=await loadImage(src);
  const old=getMap();
  if(!keepObjects){ objects=objects.filter(o=>o.type!=='map'); }
  else if(old){ objects=objects.filter(o=>o!==old); }
  const mo={type:'map',img:im,src:src,x:0,y:0,w:im.naturalWidth,h:im.naturalHeight,alpha:1};
  objects.unshift(mo);
  fitMap('contain');
  updateMapNote(); redraw();
}
async function loadMapWithConfirm(src){
  const others=objects.filter(o=>o.type!=='map').length;
  if(others&&!confirm('新しい地図を読み込むと、今の書き込みは消えます。よろしいですか？'))return;
  objects=objects.filter(o=>o.type==='map');
  undoStack=[]; redoStack=[]; selected=null; cascade=0;
  await setMapFromSrc(src,false);
}
// 「枠に収める」ときの幅を 100% として、地図の倍率を扱う
function mapContainW(){
  const mo=getMap(); if(!mo)return 0;
  const r=mapRect(), iw=mo.img.naturalWidth, ih=mo.img.naturalHeight;
  return iw*Math.min(r.w/iw,r.h/ih);
}
function mapPercent(){
  const mo=getMap(), cw=mapContainW();
  return (mo&&cw)?Math.round(mo.w/cw*100):100;
}
function setMapPercent(v){
  const mo=getMap(), cw=mapContainW(); if(!mo||!cw)return;
  const cx=mo.x+mo.w/2, cy=mo.y+mo.h/2;          // 中心を動かさずに拡大縮小する
  mo.w=cw*v/100;
  mo.h=mo.w*mo.img.naturalHeight/mo.img.naturalWidth;
  mo.x=cx-mo.w/2; mo.y=cy-mo.h/2;
}
function updateMapNote(){
  const mo=getMap();
  const on=!!mo;
  ['mapZoom','btnMapSmaller','btnMapBigger','btnFitContain','btnFitCover','btnPickMap']
    .forEach(id=>{ document.getElementById(id).disabled=!on; });
  if(!on){
    mapNote.textContent='地図を読み込むと、ここで大きさを調整できます。';
    document.getElementById('mapZoomLabel').textContent='—';
    return;
  }
  const p=mapPercent();
  document.getElementById('mapZoom').value=Math.min(400,Math.max(20,p));
  document.getElementById('mapZoomLabel').textContent=p+'%';
  mapNoteText();
}

/* ---------- 写真 ---------- */
function defaultTail(o){
  const m=mapRect(), cx=o.x+o.w/2;
  let y=o.y+o.h+base*10;
  if(y>m.y+m.h-base*2)y=Math.max(m.y+base*2,o.y-base*10);
  return {x:Math.min(Math.max(cx,base*2),cv.width-base*2),
          y:Math.min(Math.max(y,m.y+base*2),m.y+m.h-base*2)};
}
async function placePhoto(src,img){
  const im=img||await loadImage(src);
  const w=Math.round(cv.width/3.4), h=Math.round(w*im.naturalHeight/im.naturalWidth);
  const c=viewCenter();
  pushUndo();
  const o={type:'photo',img:im,src:src,x:Math.round(c.x-w/2+cascade),y:Math.round(c.y-h/2+cascade),
           w:w,h:h,num:nextNum('photo'),color:color,alpha:1,mode:photoModeSel.value};
  const t=defaultTail(o); o.tx=t.x; o.ty=t.y;
  cascade=(cascade+40)%160;
  objects.push(o); selected=o; setTool('select'); redraw();
  return o;
}
async function incomingImage(src){
  if(!getMap()){ await loadMapWithConfirm(src); return; }
  if(confirm('貼り付けた画像を「地図」として読み込みますか？\n\n［OK］新しい地図にする（今の書き込みは消えます）\n［キャンセル］差し込み写真にする')){
    await loadMapWithConfirm(src);
  }else{
    await addTrayPhoto(src,true);
  }
}
function renderTray(){
  trayList.innerHTML='';
  tray.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='titem'; d.title='クリックすると用紙に置きます';
    const im=document.createElement('img'); im.src=t.src; d.appendChild(im);
    const cap=document.createElement('div'); cap.className='cap'; cap.textContent='写真 '+(i+1); d.appendChild(cap);
    const del=document.createElement('button'); del.className='del'; del.textContent='✕'; del.title='この写真を一覧から外す';
    del.onclick=ev=>{ ev.stopPropagation(); tray.splice(i,1); renderTray(); };
    d.appendChild(del);
    d.onclick=()=>{ placePhoto(t.src,t.img).then(()=>setHint('写真を置きました。ドラッグで移動、右下の□で大きさ変更できます。')); };
    trayList.appendChild(d);
  });
}
async function addTrayPhoto(src,place){
  const im=await loadImage(src);
  tray.push({src:src,img:im});
  renderTray();
  if(place!==false){
    await placePhoto(src,im);
    setHint('写真を置きました。ドラッグで移動、右下の□で大きさ変更できます。');
  }
}
function armTray(on){
  pasteTarget=on?'tray':'map';
  dropZone.classList.toggle('armed',on);
  dropZone.innerHTML=on
    ? '✅ 貼り付け先はここです<br><kbd>Ctrl</kbd>+<kbd>V</kbd> で写真を追加<br><small>（画像のドラッグ＆ドロップも可）</small>'
    : 'ここをクリックしてから<br><kbd>Ctrl</kbd>+<kbd>V</kbd> で写真を貼り付け<br><small>（画像のドラッグ＆ドロップも可）</small>';
}
dropZone.onclick=()=>armTray(true);
document.getElementById('btnPhotoFile').onclick=()=>{ armTray(true); filePhoto.click(); };
document.getElementById('side').addEventListener('pointerdown',()=>armTray(true));
stage.addEventListener('pointerdown',()=>armTray(false));

/* ---------- 描画 ---------- */
function redraw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  const mo=getMap(), r=mapRect();
  if(mo){
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x,r.y,r.w,r.h); ctx.clip();
    ctx.globalAlpha=(mo.alpha==null?1:mo.alpha);
    ctx.drawImage(mo.img,mo.x,mo.y,mo.w,mo.h);
    ctx.restore();
  }
  drawTitle();
  drawFootText();
  for(const o of objects) if(o.type!=='map') drawObj(o);
  if(tempShape){ ctx.save(); ctx.globalAlpha=0.75; (tempShape.type==='rect'?drawRect:drawEllipse)(tempShape); ctx.restore(); }
  if(drawing){
    const pts=drawing.points.concat(cursorPos?[cursorPos]:[]);
    const prev={points:pts,mul:thickMul(),color:color,dash:dashVal()};
    ctx.save(); ctx.globalAlpha=0.75*alphaVal();
    if(pts.length>=2)(drawing.type==='line'?drawLine:drawArrow)(prev);
    else if(pts.length===1){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(pts[0].x,pts[0].y,base*0.7,0,7); ctx.fill(); }
    ctx.restore();
  }
  if(!exporting){
    drawGuides();
    if(selected)drawSelection(selected);
  }
}
function drawTitle(){
  const h=headPx(); if(!h)return;
  const s=h*0.48;
  ctx.save();
  ctx.font='bold '+Math.round(s)+'px "Meiryo",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='#111';
  ctx.fillText('現場経路図　'+siteName.value.trim(),MM*10,h*0.55);
  ctx.restore();
}
function layoutFootText(){
  const fs=Math.max(10,base*parseFloat(footFontSel.value)), pad=fs*0.8, lh=fs*1.5, lines=[];
  if(footText){
    ctx.save();
    ctx.font='bold '+Math.round(fs)+'px "Meiryo",sans-serif';
    const maxW=cv.width-MM*20;
    for(const para of footText.split('\n')){
      if(para===''){ lines.push(''); continue; }
      let line='';
      for(const ch of para){
        if(ctx.measureText(line+ch).width>maxW&&line){ lines.push(line); line=ch; }
        else line+=ch;
      }
      if(line)lines.push(line);
    }
    ctx.restore();
  }
  return {fs:fs,pad:pad,lh:lh,lines:lines,height:lines.length?pad+lines.length*lh:0};
}
function drawFootText(){
  const fh=footPx(); if(fh<=0)return;
  const L=layoutFootText();
  if(!L.lines.length)return;
  ctx.save();
  ctx.font='bold '+Math.round(L.fs)+'px "Meiryo",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillStyle='#111';
  let y=dividerY()+L.pad;
  for(const line of L.lines){
    if(y>cv.height-L.fs*0.6)break;
    if(line)ctx.fillText(line,MM*10,y);
    y+=L.lh;
  }
  ctx.restore();
}
function drawGuides(){
  const r=mapRect(), fh=footPx();
  ctx.save();
  ctx.lineWidth=Math.max(1,2/scaleNow());
  ctx.setLineDash([9/scaleNow(),7/scaleNow()]);
  ctx.strokeStyle='rgba(150,150,150,.85)';
  ctx.strokeRect(MM*10,MM*10,cv.width-MM*20,cv.height-MM*20);
  ctx.strokeStyle='rgba(26,115,232,.6)';
  ctx.strokeRect(r.x+1,r.y+1,r.w-2,r.h-2);
  if(fh>0){
    ctx.strokeStyle='rgba(240,150,0,.85)';
    ctx.strokeRect(1,dividerY()+1,cv.width-2,fh-2);
  }
  if(!getMap())drawMapPlaceholder(r);
  const t=tabRect();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.strokeStyle='rgba(240,150,0,.95)';
  ctx.lineWidth=Math.max(1,2/scaleNow());
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(t.x,t.y,t.w,t.h,t.h/2); ctx.fill(); ctx.stroke(); }
  else { ctx.fillRect(t.x,t.y,t.w,t.h); ctx.strokeRect(t.x,t.y,t.w,t.h); }
  ctx.strokeStyle='rgba(180,110,0,.9)';
  for(let i=-1;i<=1;i++){
    const x=t.x+t.w/2+i*t.h*0.7;
    ctx.beginPath(); ctx.moveTo(x,t.y+t.h*0.28); ctx.lineTo(x,t.y+t.h*0.72); ctx.stroke();
  }
  ctx.restore();
}
// 文字とキートップ（[Win] など）を混ぜた1行を描く
function runsWidth(runs,fs){
  const kpad=fs*0.36, gap=fs*0.12;
  ctx.font='bold '+Math.round(fs)+'px "Meiryo",sans-serif';
  let w=0;
  for(const r of runs)w+=r.k?(ctx.measureText(r.k).width+kpad*2+gap*2):ctx.measureText(r.t).width;
  return w;
}
function drawRuns(runs,x0,y,fs,col,leftAlign){
  const kpad=fs*0.36, gap=fs*0.12, h=fs*1.36;
  let x=leftAlign?x0:(x0-runsWidth(runs,fs)/2);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(fs)+'px "Meiryo",sans-serif';
  for(const r of runs){
    if(r.k){
      const w=ctx.measureText(r.k).width+kpad*2;
      x+=gap;
      ctx.fillStyle='#39465a';
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y-h/2,w,h,fs*0.24);ctx.fill();}
      else ctx.fillRect(x,y-h/2,w,h);
      ctx.fillStyle='#fff'; ctx.fillText(r.k,x+kpad,y+fs*0.04);
      x+=w+gap;
    }else{
      ctx.fillStyle=col; ctx.fillText(r.t,x,y);
      x+=ctx.measureText(r.t).width;
    }
  }
}
function drawMapPlaceholder(r){
  const fs=Math.max(11,MM*3.8), hs=fs*1.35, lh=fs*2.05, ns=fs*0.88;
  const head='🗺 ここに地図を貼り付けます';
  const lines=[
    [{t:'① Googleマップ・ヤフー地図で現場のまわりを表示する'}],
    [{t:'② '},{k:'Win'},{t:'＋'},{k:'Shift'},{t:'＋'},{k:'S'},{t:' を押す（画面が白くなります）'}],
    [{t:'③ 地図の写したい範囲をドラッグで囲む'}],
    [{t:'④ この画面に戻って '},{k:'Ctrl'},{t:'＋'},{k:'V'},{t:' を押す'}]
  ];
  const note='画像ファイルをここへドラッグ、または上の「🗺 地図を読み込む」からでも取り込めます';
  ctx.save();
  ctx.setLineDash([]);
  ctx.font='bold '+Math.round(hs)+'px "Meiryo",sans-serif';
  let maxW=ctx.measureText(head).width;
  for(const l of lines)maxW=Math.max(maxW,runsWidth(l,fs));
  ctx.font=Math.round(ns)+'px "Meiryo",sans-serif';
  maxW=Math.max(maxW,ctx.measureText(note).width);
  const padX=fs*2.2, padY=fs*1.7;
  const boxW=Math.min(r.w-MM*16,maxW+padX*2);
  const boxH=padY*2+hs*1.7+lines.length*lh+ns*2.2;
  const bx=r.x+(r.w-boxW)/2, by=r.y+(r.h-boxH)/2;
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.strokeStyle='rgba(26,115,232,.5)';
  ctx.lineWidth=Math.max(1,fs*0.09);
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(bx,by,boxW,boxH,fs*0.9); ctx.fill(); ctx.stroke(); }
  else { ctx.fillRect(bx,by,boxW,boxH); ctx.strokeRect(bx,by,boxW,boxH); }
  const cx=bx+boxW/2;
  let y=by+padY+hs*0.7;
  ctx.font='bold '+Math.round(hs)+'px "Meiryo",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#1a5fb4';
  ctx.fillText(head,cx,y);
  y+=hs*1.0+lh*0.5;
  let stepW=0;
  for(const l of lines)stepW=Math.max(stepW,runsWidth(l,fs));
  const leftX=cx-stepW/2;                       // 番号を左端でそろえる
  for(const l of lines){ drawRuns(l,leftX,y,fs,'#33404f',true); y+=lh; }
  ctx.font=Math.round(ns)+'px "Meiryo",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#6b7684';
  ctx.fillText(note,cx,y+ns*0.4);
  ctx.restore();
}
function drawObj(o){
  ctx.save();
  ctx.globalAlpha=(o.alpha==null?1:o.alpha);
  switch(o.type){
    case 'arrow':drawArrow(o);break;
    case 'line':drawLine(o);break;
    case 'pin':drawPin(o);break;
    case 'guard':drawGuard(o);break;
    case 'ellipse':drawEllipse(o);break;
    case 'rect':drawRect(o);break;
    case 'text':drawText(o);break;
    case 'photo':drawPhoto(o);break;
  }
  ctx.restore();
}
function strokePts(pts,w,col,dash){
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
  ctx.setLineDash([]);
}
function halo(w){ return w+Math.max(3,w*0.8); }
function fillHead(tip,ang,len,col){
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(tip.x,tip.y);
  ctx.lineTo(tip.x-len*Math.cos(ang-0.42),tip.y-len*Math.sin(ang-0.42));
  ctx.lineTo(tip.x-len*Math.cos(ang+0.42),tip.y-len*Math.sin(ang+0.42));
  ctx.closePath(); ctx.fill();
}
function drawArrow(o){
  const pts=o.points; if(pts.length<2)return;
  const w=lineW(o), outer=halo(w);
  const tip=pts[pts.length-1], prev=pts[pts.length-2];
  const ang=Math.atan2(tip.y-prev.y,tip.x-prev.x);
  const head=Math.max(w*3,base*0.9);
  const segLen=Math.hypot(tip.x-prev.x,tip.y-prev.y);
  const cut=Math.min(head*0.75,segLen*0.9);
  const shaft=pts.slice(0,-1).concat([{x:tip.x-Math.cos(ang)*cut,y:tip.y-Math.sin(ang)*cut}]);
  const pad=(outer-w)*0.9;
  const tipW={x:tip.x+Math.cos(ang)*pad,y:tip.y+Math.sin(ang)*pad};
  strokePts(shaft,outer,'#ffffff');
  fillHead(tipW,ang,head+pad*2,'#ffffff');
  strokePts(shaft,w,o.color);
  fillHead(tip,ang,head,o.color);
}
/* 矢印の付かない線。矢印と同じく白フチ付きで、地図の上でも見やすくします */
function drawLine(o){
  const pts=o.points; if(pts.length<2)return;
  const w=lineW(o), outer=halo(w), d=dashPattern(o.dash,w);
  strokePts(pts,outer,'#ffffff',d);
  strokePts(pts,w,o.color,d);
}
function drawBadge(x,y,r,num,col){
  ctx.beginPath(); ctx.arc(x,y,r,0,7);
  ctx.fillStyle=col; ctx.fill();
  ctx.lineWidth=Math.max(2,r*0.16); ctx.strokeStyle='#fff'; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(r*1.15)+'px "Meiryo",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(num),x,y+r*0.06);
}
function drawPin(o){ drawBadge(o.x,o.y,pinR(o),o.num,o.color); }
function drawGuard(o){
  const r=guardR(o), cx=o.x, cy=o.y-r*1.414;
  ctx.beginPath();
  ctx.arc(cx,cy,r,0.75*Math.PI,0.25*Math.PI);
  ctx.lineTo(o.x,o.y); ctx.closePath();
  ctx.lineJoin='round'; ctx.lineWidth=Math.max(2,r*0.22); ctx.strokeStyle='#fff'; ctx.stroke();
  ctx.fillStyle=o.color; ctx.fill();
  ctx.fillStyle='#fff'; ctx.strokeStyle='#fff'; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(cx-0.40*r,cy+0.66*r);
  ctx.lineTo(cx-0.26*r,cy+0.20*r);
  ctx.quadraticCurveTo(cx,cy+0.06*r,cx+0.26*r,cy+0.20*r);
  ctx.lineTo(cx+0.40*r,cy+0.66*r);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth=0.13*r;
  ctx.beginPath(); ctx.moveTo(cx+0.17*r,cy+0.27*r); ctx.lineTo(cx+0.44*r,cy+0.00*r); ctx.stroke();
  ctx.lineWidth=0.17*r;
  ctx.beginPath(); ctx.moveTo(cx+0.49*r,cy-0.20*r); ctx.lineTo(cx+0.72*r,cy-0.46*r); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy-0.16*r,0.175*r,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx,cy-0.35*r,0.38*r,0.085*r,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy-0.37*r,0.24*r,Math.PI,0); ctx.fill();
  ctx.strokeStyle=o.color; ctx.lineWidth=0.05*r;
  ctx.beginPath(); ctx.moveTo(cx-0.20*r,cy-0.30*r); ctx.lineTo(cx+0.20*r,cy-0.30*r); ctx.stroke();
  if(o.label){
    const s=Math.max(9,r*0.85);
    ctx.font='bold '+Math.round(s)+'px "Meiryo",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top'; ctx.lineJoin='round';
    ctx.lineWidth=Math.max(2,s/5); ctx.strokeStyle='#fff';
    ctx.strokeText(o.label,o.x,o.y+s*0.35);
    ctx.fillStyle=o.color; ctx.fillText(o.label,o.x,o.y+s*0.35);
  }
}
function drawEllipse(o){
  if(o.rx<1||o.ry<1)return;
  const w=lineW(o);
  ctx.beginPath(); ctx.ellipse(o.cx,o.cy,o.rx,o.ry,0,0,7);
  ctx.lineWidth=halo(w); ctx.strokeStyle='#fff'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(o.cx,o.cy,o.rx,o.ry,0,0,7);
  ctx.lineWidth=w; ctx.strokeStyle=o.color; ctx.stroke();
}
function drawRect(o){
  if(o.w<1||o.h<1)return;
  const w=lineW(o), rr=Math.min(o.w,o.h)*0.06;
  const path=()=>{ ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(o.x,o.y,o.w,o.h,rr); else ctx.rect(o.x,o.y,o.w,o.h); };
  ctx.lineJoin='round';
  path(); ctx.lineWidth=halo(w); ctx.strokeStyle='#fff'; ctx.stroke();
  path(); ctx.lineWidth=w; ctx.strokeStyle=o.color; ctx.stroke();
}
function drawText(o){
  const s=textSize(o);
  ctx.font='bold '+Math.round(s)+'px "Meiryo",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  ctx.lineWidth=Math.max(2,s/6); ctx.strokeStyle='#fff';
  ctx.strokeText(o.text,o.x,o.y);
  ctx.fillStyle=o.color; ctx.fillText(o.text,o.x,o.y);
}
function calloutTri(o,bw){
  const rx=o.x-bw, ry=o.y-bw, rw=o.w+bw*2, rh=o.h+bw*2;
  const cx=rx+rw/2, cy=ry+rh/2;
  const dx=o.tx-cx, dy=o.ty-cy;
  if(!dx&&!dy)return null;
  const sx=dx?(rw/2)/Math.abs(dx):Infinity;
  const sy=dy?(rh/2)/Math.abs(dy):Infinity;
  const s=Math.min(sx,sy)*0.92;
  const ex=cx+dx*s, ey=cy+dy*s;
  const len=Math.hypot(dx,dy)||1, half=Math.min(rw,rh)*0.15;
  return [{x:ex+(dy/len)*half,y:ey-(dx/len)*half},{x:ex-(dy/len)*half,y:ey+(dx/len)*half}];
}
function drawPhoto(o){
  const bw=Math.max(3,base*0.6), col=o.color||'#e60012';
  if(o.mode==='callout'&&o.tx!=null){
    const t=calloutTri(o,bw);
    if(t){
      ctx.beginPath(); ctx.moveTo(t[0].x,t[0].y); ctx.lineTo(o.tx,o.ty); ctx.lineTo(t[1].x,t[1].y); ctx.closePath();
      ctx.fillStyle='#fff'; ctx.fill();
      ctx.lineJoin='round'; ctx.lineWidth=Math.max(2,bw*0.5); ctx.strokeStyle=col; ctx.stroke();
    }
  }
  ctx.fillStyle='#fff';
  ctx.fillRect(o.x-bw,o.y-bw,o.w+bw*2,o.h+bw*2);
  ctx.drawImage(o.img,o.x,o.y,o.w,o.h);
  if(o.mode==='callout'){
    ctx.lineWidth=Math.max(2,bw*0.5); ctx.strokeStyle=col; ctx.lineJoin='miter';
    ctx.strokeRect(o.x-bw*0.75,o.y-bw*0.75,o.w+bw*1.5,o.h+bw*1.5);
    if(o.tx!=null){
      ctx.beginPath(); ctx.arc(o.tx,o.ty,Math.max(3,bw*0.8),0,7);
      ctx.fillStyle=col; ctx.fill();
      ctx.lineWidth=Math.max(2,bw*0.3); ctx.strokeStyle='#fff'; ctx.stroke();
    }
  }else if(o.num){
    drawBadge(o.x-bw,o.y-bw,Math.max(base*1.6,o.w*0.07),o.num,col);
  }
}

/* ---------- 選択とハンドル ---------- */
function handleSize(){ return Math.max(14,18/scaleNow()); }
function selPad(){ return handleSize()*0.4; }
function handlePos(o){
  if(isPoly(o.type))return null;
  const b=getBBox(o), d=selPad()+handleSize()*0.5, m=handleSize()*0.6;
  // 地図は用紙いっぱいに広がるので、□は枠の内側に置く（外だと画面外で掴めない）
  if(o.type==='map')return {x:b.x+b.w-d,y:b.y+b.h-d};
  return {x:Math.min(b.x+b.w+d,cv.width-m),y:Math.min(b.y+b.h+d,cv.height-m)};
}
function tailPos(o){
  return (o.type==='photo'&&o.mode==='callout'&&o.tx!=null)?{x:o.tx,y:o.ty}:null;
}
function anchorOf(o){ return (o.type==='ellipse')?{x:o.cx,y:o.cy}:{x:o.x,y:o.y}; }
function drawHandle(x,y,fill){
  const hs=handleSize(), lw=Math.max(2,3/scaleNow());
  ctx.setLineDash([]);
  ctx.fillStyle=fill||'#fff'; ctx.strokeStyle='#1a73e8'; ctx.lineWidth=lw;
  ctx.fillRect(x-hs/2,y-hs/2,hs,hs);
  ctx.strokeRect(x-hs/2,y-hs/2,hs,hs);
}
function drawSelection(o){
  const b=getBBox(o); if(!b)return;
  const lw=Math.max(2,3/scaleNow()), pad=selPad();
  ctx.save();
  ctx.globalAlpha=1;
  ctx.strokeStyle='#1a73e8'; ctx.lineWidth=lw; ctx.setLineDash([4*lw,3*lw]);
  ctx.strokeRect(b.x-pad,b.y-pad,b.w+pad*2,b.h+pad*2);
  if(isPoly(o.type)){ o.points.forEach(p=>drawHandle(p.x,p.y)); }
  else{
    const h=handlePos(o); if(h)drawHandle(h.x,h.y);
    const t=tailPos(o); if(t)drawHandle(t.x,t.y,'#ffe08a');
  }
  ctx.restore();
}
function getBBox(o){
  switch(o.type){
    case 'map':{
      const r=mapRect();
      const x=Math.max(o.x,r.x), y=Math.max(o.y,r.y);
      const x2=Math.min(o.x+o.w,r.x+r.w), y2=Math.min(o.y+o.h,r.y+r.h);
      return {x:x,y:y,w:Math.max(10,x2-x),h:Math.max(10,y2-y)};
    }
    case 'arrow':case 'line':{
      const xs=o.points.map(p=>p.x),ys=o.points.map(p=>p.y);
      const x=Math.min.apply(null,xs),y=Math.min.apply(null,ys);
      return {x:x,y:y,w:Math.max.apply(null,xs)-x,h:Math.max.apply(null,ys)-y};
    }
    case 'pin':{const r=pinR(o);return {x:o.x-r,y:o.y-r,w:r*2,h:r*2};}
    case 'guard':{
      const r=guardR(o), lab=o.label?r*1.2:0;
      return {x:o.x-r,y:o.y-r*2.414,w:r*2,h:r*2.414+lab};
    }
    case 'ellipse':return {x:o.cx-o.rx,y:o.cy-o.ry,w:o.rx*2,h:o.ry*2};
    case 'rect':return {x:o.x,y:o.y,w:o.w,h:o.h};
    case 'text':{
      const s=textSize(o);
      ctx.font='bold '+Math.round(s)+'px "Meiryo",sans-serif';
      return {x:o.x-4,y:o.y-s*0.7,w:ctx.measureText(o.text).width+8,h:s*1.4};
    }
    case 'photo':{
      const bw=Math.max(3,base*0.6);
      return {x:o.x-bw,y:o.y-bw,w:o.w+bw*2,h:o.h+bw*2};
    }
  }
}

/* ---------- 当たり判定 ---------- */
function distSeg(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy;
  if(!L2)return Math.hypot(p.x-a.x,p.y-a.y);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));
}
function inBBox(o,p){
  const b=getBBox(o);
  return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
}
function hitObj(o,p){
  const tol=Math.max(10,12/scaleNow());
  switch(o.type){
    case 'map':case 'photo':case 'text':case 'guard':return inBBox(o,p);
    case 'pin':return Math.hypot(p.x-o.x,p.y-o.y)<=pinR(o)+tol/2;
    case 'ellipse':{
      if(o.rx<1||o.ry<1)return false;
      const v=Math.hypot((p.x-o.cx)/o.rx,(p.y-o.cy)/o.ry);
      return Math.abs(v-1)*Math.min(o.rx,o.ry)<=Math.max(tol,lineW(o));
    }
    case 'rect':{
      const t=Math.max(tol,lineW(o));
      const outer=(p.x>=o.x-t&&p.x<=o.x+o.w+t&&p.y>=o.y-t&&p.y<=o.y+o.h+t);
      const inner=(p.x>=o.x+t&&p.x<=o.x+o.w-t&&p.y>=o.y+t&&p.y<=o.y+o.h-t);
      return outer&&!inner;
    }
    case 'arrow':case 'line':{
      for(let i=0;i<o.points.length-1;i++)
        if(distSeg(p,o.points[i],o.points[i+1])<=Math.max(tol,lineW(o)*0.8))return true;
      return false;
    }
  }
  return false;
}
function hitTest(p){
  const t=tabRect();
  if(p.x>=t.x-8&&p.x<=t.x+t.w+8&&p.y>=t.y-8&&p.y<=t.y+t.h+8)return {obj:null,handle:'divider'};
  if(selected){
    const tol=handleSize()*0.5;
    if(isPoly(selected.type)){
      for(let i=0;i<selected.points.length;i++){
        const q=selected.points[i];
        if(Math.abs(p.x-q.x)<=tol&&Math.abs(p.y-q.y)<=tol)return {obj:selected,handle:'pt',index:i};
      }
    }else{
      const tp=tailPos(selected);
      if(tp&&Math.abs(p.x-tp.x)<=tol&&Math.abs(p.y-tp.y)<=tol)return {obj:selected,handle:'tail'};
      const h=handlePos(selected);
      if(h&&Math.abs(p.x-h.x)<=tol&&Math.abs(p.y-h.y)<=tol)return {obj:selected,handle:'resize'};
    }
  }
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    if(o.type==='map'&&o!==selected)continue;   // 地図は「調整」で選んだときだけ掴める
    if(hitObj(o,p))return {obj:o,handle:null};
  }
  return {obj:null,handle:null};
}
function moveObj(o,dx,dy){
  switch(o.type){
    case 'arrow':case 'line':o.points.forEach(pt=>{pt.x+=dx;pt.y+=dy;});break;
    case 'ellipse':o.cx+=dx;o.cy+=dy;break;
    default:o.x+=dx;o.y+=dy;
  }
}
function deleteSelected(){
  if(!selected)return;
  if(selected.type==='map'&&!confirm('地図を削除しますか？'))return;
  pushUndo();
  objects=objects.filter(o=>o!==selected);
  selected=null; updateMapNote(); redraw();
}
function nearestOpt(sel,v){
  let best=null;
  for(const op of sel.options){
    const n=parseFloat(op.value);
    if(best===null||Math.abs(n-v)<Math.abs(best-v))best=n;
  }
  return String(best);
}
function syncStyleUI(){
  if(!selected)return;
  if(selected.mul!=null)thickSel.value=nearestOpt(thickSel,selected.mul);
  alphaSel.value=nearestOpt(alphaSel,selected.alpha==null?1:selected.alpha);
  if(selected.type==='line'&&selected.dash)dashSel.value=selected.dash;
  if(selected.type==='photo'&&selected.mode)photoModeSel.value=selected.mode;
}
/* 矢印・罫線の確定 */
function finalizeArrow(){
  if(!drawing)return;
  const pts=drawing.points, kind=drawing.type||'arrow'; drawing=null;
  if(pts.length>=2){
    pushUndo();
    const o={type:kind,points:pts,mul:thickMul(),color:color,alpha:alphaVal()};
    if(kind==='line')o.dash=dashVal();
    objects.push(o);
  }
  redraw();
}

/* ---------- ポインタ操作 ---------- */
cv.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const p=toCanvas(e);
  cursorPos=p;
  if(tool==='select'){
    const h=hitTest(p);
    preSnap=cloneObjects(); movedInDrag=false;
    if(h.handle==='divider'){
      dragMode='divider'; selected=null; capturePointer(e); redraw(); return;
    }
    if(h.obj){
      selected=h.obj; dragStart=p;
      if(h.handle==='pt'){ dragMode='pt'; dragIndex=h.index; }
      else if(h.handle==='tail'){ dragMode='tail'; }
      else if(h.handle==='resize'){
        dragMode='resize';
        const a=anchorOf(selected), hp=handlePos(selected);
        resizeRef={mul:selected.mul,w:selected.w,h:selected.h,rx:selected.rx,ry:selected.ry,
                   px:p.x,py:p.y,gx:p.x-hp.x,gy:p.y-hp.y,
                   dist:Math.max(1,Math.hypot(hp.x-a.x,hp.y-a.y))};
      }else dragMode='move';
      capturePointer(e); syncStyleUI();
    }else{ selected=null; dragMode=null; }
    redraw();
  }else if(tool==='ellipse'||tool==='rect'){
    dragMode='shape'; dragStart=p;
    tempShape=(tool==='rect')
      ? {type:'rect',x:p.x,y:p.y,w:1,h:1,mul:thickMul(),color:color,alpha:alphaVal()}
      : {type:'ellipse',cx:p.x,cy:p.y,rx:1,ry:1,mul:thickMul(),color:color,alpha:alphaVal()};
    capturePointer(e);
  }
});
cv.addEventListener('pointermove',e=>{
  const p=toCanvas(e);
  cursorPos=p;
  const snap=()=>{ if(!movedInDrag){undoStack.push(preSnap);redoStack.length=0;movedInDrag=true;} };
  if(dragMode==='divider'){
    const maxMM=parseFloat(footRange.max);
    footMM=Math.min(maxMM,Math.max(0,(cv.height-p.y)/MM));
    footRange.value=Math.round(footMM);
    updateFootUI(); updateMapNote(); redraw();
  }else if(dragMode==='move'&&selected){
    snap(); moveObj(selected,p.x-dragStart.x,p.y-dragStart.y);
    dragStart=p;
    if(selected.type==='map')updateMapNote();
    redraw();
  }else if(dragMode==='pt'&&selected){
    snap(); selected.points[dragIndex]={x:p.x,y:p.y}; redraw();
  }else if(dragMode==='tail'&&selected){
    snap(); selected.tx=p.x; selected.ty=p.y; redraw();
  }else if(dragMode==='resize'&&selected){
    snap();
    const o=selected, r=resizeRef;
    if(o.type==='photo'||o.type==='map'){
      const w=Math.max(40,r.w+(p.x-r.px));
      o.w=w; o.h=w*o.img.naturalHeight/o.img.naturalWidth;
      if(o.type==='map')updateMapNote();
    }else if(o.type==='ellipse'){
      o.rx=Math.max(6,r.rx+(p.x-r.px)); o.ry=Math.max(6,r.ry+(p.y-r.py));
    }else if(o.type==='rect'){
      o.w=Math.max(10,r.w+(p.x-r.px)); o.h=Math.max(10,r.h+(p.y-r.py));
    }else{
      const a=anchorOf(o);
      const d=Math.hypot(p.x-r.gx-a.x,p.y-r.gy-a.y);
      o.mul=Math.min(10,Math.max(0.1,r.mul*d/r.dist));
    }
    redraw();
  }else if(dragMode==='shape'&&tempShape){
    if(tempShape.type==='rect'){
      tempShape.x=Math.min(dragStart.x,p.x); tempShape.y=Math.min(dragStart.y,p.y);
      tempShape.w=Math.abs(p.x-dragStart.x); tempShape.h=Math.abs(p.y-dragStart.y);
    }else{
      tempShape.cx=(dragStart.x+p.x)/2; tempShape.cy=(dragStart.y+p.y)/2;
      tempShape.rx=Math.abs(p.x-dragStart.x)/2; tempShape.ry=Math.abs(p.y-dragStart.y)/2;
    }
    redraw();
  }else if(drawing){ redraw(); }
});
cv.addEventListener('pointerup',()=>{
  if(dragMode==='shape'&&tempShape){
    const big=(tempShape.type==='rect')?(tempShape.w>12&&tempShape.h>12):(tempShape.rx>8&&tempShape.ry>8);
    if(big){ pushUndo(); objects.push(tempShape); selected=tempShape; setTool('select'); }
    tempShape=null; redraw();
  }
  if(dragMode==='resize')syncStyleUI();
  dragMode=null; dragIndex=-1;
});
cv.addEventListener('click',e=>{
  const p=toCanvas(e);
  if(isPoly(tool)){
    if(!drawing)drawing={points:[],type:tool};
    const pts=drawing.points;
    if(!pts.length||Math.hypot(p.x-pts[pts.length-1].x,p.y-pts[pts.length-1].y)>3)pts.push(p);
    redraw();
  }else if(tool==='pin'){
    pushUndo();
    objects.push({type:'pin',x:p.x,y:p.y,num:nextNum('pin'),mul:thickMul(),color:color,alpha:alphaVal()});
    redraw();
  }else if(tool==='guard'){
    pushUndo();
    objects.push({type:'guard',x:p.x,y:p.y,label:'警備員',mul:thickMul(),color:color,alpha:alphaVal()});
    redraw();
  }else if(tool==='text'){
    const t=prompt('表示する文字を入力してください','この先 入口');
    if(t){
      pushUndo();
      objects.push({type:'text',x:p.x,y:p.y,text:t,mul:thickMul(),color:color,alpha:alphaVal()});
      redraw();
    }
  }
});
cv.addEventListener('dblclick',e=>{
  e.preventDefault();
  if(isPoly(tool)){finalizeArrow();return;}
  if(tool==='select'&&selected){
    if(selected.type==='text'){
      const t=prompt('文字を変更',selected.text);
      if(t!==null&&t!==''){pushUndo();selected.text=t;redraw();}
    }else if(selected.type==='guard'){
      const t=prompt('ガードマンの文字を変更（空欄にすると文字なし）',selected.label);
      if(t!==null){pushUndo();selected.label=t;redraw();}
    }else if(selected.type==='pin'||selected.type==='photo'){
      const n=parseInt(prompt('番号を変更',selected.num),10);
      if(!isNaN(n)){pushUndo();selected.num=n;redraw();}
    }
  }
});
cv.addEventListener('contextmenu',e=>{
  if(isPoly(tool)&&drawing){e.preventDefault();finalizeArrow();}
});
window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key==='Escape'){
    if(drawing){drawing=null;redraw();} else if(selected){selected=null;redraw();}
  }else if(e.key==='Enter'){ if(isPoly(tool)&&drawing)finalizeArrow(); }
  else if(e.key==='Delete'||e.key==='Backspace'){ deleteSelected(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){ e.preventDefault();undo(); }
  else if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault();redo(); }
});

/* ---------- ツール・色・太さ・濃さ ---------- */
function setTool(t){
  tool=t; drawing=null;
  if(t!=='select')selected=null;
  document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  cv.style.cursor=(t==='select')?'default':'crosshair';
  setHint(); redraw();
}
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{
  color=b.dataset.color;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s===b));
  if(selected&&selected.type!=='map'){pushUndo();selected.color=color;redraw();}
}));
thickSel.addEventListener('change',()=>{
  if(selected&&selected.mul!=null){ pushUndo(); selected.mul=thickMul(); redraw(); }
});
alphaSel.addEventListener('change',()=>{
  if(selected){ pushUndo(); selected.alpha=alphaVal(); redraw(); }
});
dashSel.addEventListener('change',()=>{
  // 罫線を選んでいれば、その線の種類を変える。何も選んでいなければ次に引く線に使う
  if(selected&&selected.type==='line'){ pushUndo(); selected.dash=dashVal(); redraw(); }
  else if(tool==='line'&&drawing)redraw();
});
photoModeSel.addEventListener('change',()=>{
  if(selected&&selected.type==='photo'){
    pushUndo();
    selected.mode=photoModeSel.value;
    if(selected.mode==='callout'&&selected.tx==null){ const t=defaultTail(selected); selected.tx=t.x; selected.ty=t.y; }
    redraw();
    setHint(selected.mode==='callout'
      ? '吹き出しの先端（黄色い□）をドラッグすると、指す場所を変えられます。'
      : '番号で示す表示にしました。地図側に同じ番号のピンを置くと対応が分かります。');
  }
});

orientSel.addEventListener('change',()=>{
  const others=objects.filter(o=>o.type!=='map').length;

    orientSel.value=orient; return;
  }

  applyPageSize(); fitMap('contain'); updateMapNote(); redraw();
});
document.getElementById('btnFitContain').onclick=()=>{

document.getElementById('btnFitCover').onclick=()=>{

document.getElementById('btnPickMap').onclick=()=>{
  const mo=getMap();
  if(!mo){alert('先に地図を読み込んでください');return;}
  setTool('select'); selected=mo; syncStyleUI(); redraw();

let mapZoomSnap=null;
const mapZoom=document.getElementById('mapZoom');
mapZoom.addEventListener('pointerdown',()=>{ mapZoomSnap=cloneObjects(); });
mapZoom.addEventListener('input',()=>{
  if(!getMap())return;
  if(mapZoomSnap){ undoStack.push(mapZoomSnap); redoStack.length=0; mapZoomSnap=null; }
  setMapPercent(parseFloat(mapZoom.value));
  document.getElementById('mapZoomLabel').textContent=Math.round(mapZoom.value)+'%';

function mapNoteText(){
  const mo=getMap(); if(!mo)return;
  const r=mapRect();
  mapNote.innerHTML='地図 <b>'+Math.round(mo.w/MM)+'×'+Math.round(mo.h/MM)+'mm</b>'
    +' ／ 枠 '+Math.round(r.w/MM)+'×'+Math.round(r.h/MM)+'mm<br>'

function stepMapZoom(d){

document.getElementById('btnArrange').onclick=()=>{
  const fh=footPx();
  if(fh<=0){alert('先に「下のスペース」の高さを 0 より大きくしてください');return;}
  const ph=objects.filter(o=>o.type==='photo');
  if(!ph.length){alert('用紙に置かれた写真がありません');return;}
  const pad=base*1.5, n=ph.length, marg=MM*10;   // 下と左右は余白ガイドの内側に収める
  const top=dividerY()+layoutFootText().height+pad*0.5;
  const availH=cv.height-marg-top;
  if(availH<base*4){ alert('下のスペースが文言でいっぱいです。高さを大きくするか、文言を減らしてください。'); return; }
  pushUndo();
  const slot=(cv.width-marg*2-pad*(n-1))/n;
  const sized=ph.map(o=>{
    const ratio=o.img.naturalHeight/o.img.naturalWidth;
    let w=slot, h=w*ratio;
    if(h>availH){ h=availH; w=h/ratio; }
    return {o:o,w:w,h:h};
  });
  const totalW=sized.reduce((s,v)=>s+v.w,0)+pad*(n-1);
  let x=(cv.width-totalW)/2;
  for(const v of sized){
    v.o.w=v.w; v.o.h=v.h; v.o.x=x; v.o.y=top+(availH-v.h)/2;
    x+=v.w+pad;
  }
  selected=null; redraw();
  setHint('写真を下のスペースに並べました。個別にドラッグで調整できます。');
};

  for(const f of fs)await addTrayPhoto(await fileToDataURL(f),fs.length===1);
};
document.getElementById('btnDel').onclick=deleteSelected;
document.getElementById('btnUndo').onclick=undo;
document.getElementById('btnRedo').onclick=redo;
document.getElementById('btnClear').onclick=()=>{
  if(!objects.filter(o=>o.type!=='map').length)return;
  if(confirm('すべての書き込みを消しますか？（地図と写真一覧は残ります）')){
    pushUndo(); objects=objects.filter(o=>o.type==='map'); selected=null; drawing=null; redraw();
  }
};
document.getElementById('btnZoomIn').onclick=()=>{userZoom=Math.min(userZoom*1.25,8);applyZoom();};
document.getElementById('btnZoomOut').onclick=()=>{userZoom=Math.max(userZoom/1.25,0.2);applyZoom();};
document.getElementById('btnFit').onclick=()=>{userZoom=1;computeFit();};
function renderClean(){ selected=null; drawing=null; exporting=true; redraw(); exporting=false; }
document.getElementById('btnPng').onclick=()=>{
  renderClean();
  cv.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=(siteName.value||'現場経路図')+'.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    redraw();
  },'image/png');
};
document.getElementById('btnPrint').onclick=()=>{
  renderClean();
  window.print();
  setTimeout(redraw,300);
};
document.getElementById('btnSaveProj').onclick=()=>{
  const data={app:'genba-keiro',version:4,site:siteName.value,
    orient:orient,footMM:footMM,footFont:footFontSel.value,footText:footText,
    tray:tray.map(t=>t.src),
    objects:objects.map(o=>{const c={...o};delete c.img;return c;})};
  const b=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=(siteName.value||'現場経路図')+'.route.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};
document.getElementById('btnOpen').onclick=()=>{ armTray(false); fileProj.click(); };
fileProj.onchange=async()=>{
  const f=fileProj.files[0]; fileProj.value='';
  if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(data.app!=='genba-keiro')throw new Error('bad file');
    if(objects.length&&!confirm('現在の内容を破棄して開きますか？'))return;
    siteName.value=data.site||'';
    orient=data.orient||'landscape'; orientSel.value=orient;
    footFontSel.value=data.footFont||'2.5';
    applyPageSize();
    if(data.version>=4){
      footMM=data.footMM||0;
      footText=data.footText||'';
      const objs=[];
      for(const o of data.objects){
        migrate(o);
        if(o.img===undefined&&(o.type==='photo'||o.type==='map'))o.img=await loadImage(o.src);
        objs.push(o);
      }
      objects=objs;
    }else{
      await loadOldFormat(data);
    }
    footRange.value=Math.round(footMM); footTextEl.value=footText;
    tray=[];
    for(const s of (data.tray||[]))tray.push({src:s,img:await loadImage(s)});
    renderTray();
    undoStack=[];redoStack=[];selected=null;
    applyPageSize(); updateMapNote();
  }catch(err){
    alert('ファイルを読み込めませんでした（このアプリの「保存」で作った .route.json を選んでください）');
  }
};
// version 3 以前（地図の大きさ＝用紙だった形式）を A4 の用紙に載せ替える
async function loadOldFormat(data){
  const im=await loadImage(data.bgSrc);
  const oldW=im.naturalWidth, oldH=im.naturalHeight;
  const oldBase=Math.min(22,Math.max(5,Math.round(oldW/160)));
  const ratio=data.footRatio||0;
  applyPageSize();
  let s=Math.min(cv.width/oldW,(cv.height-headPx())/(oldH*(1+ratio)));
  footMM=Math.min(parseFloat(footRange.max),(oldH*ratio*s)/MM);
  footRange.value=Math.round(footMM);
  const r=mapRect();
  s=Math.min(r.w/oldW,r.h/oldH);
  const dx=r.x+(r.w-oldW*s)/2, dy=r.y+(r.h-oldH*s)/2;
  footText=data.footText||'';
  const objs=[{type:'map',img:im,src:data.bgSrc,x:dx,y:dy,w:oldW*s,h:oldH*s,alpha:1}];
  const k=s*oldBase/Math.max(5,Math.round(cv.width/160));
  for(const o of data.objects){
    migrate(o);
    if(o.points)o.points=o.points.map(p=>({x:p.x*s+dx,y:p.y*s+dy}));
    if(o.x!=null){o.x=o.x*s+dx;o.y=o.y*s+dy;}
    if(o.cx!=null){o.cx=o.cx*s+dx;o.cy=o.cy*s+dy;}
    if(o.tx!=null){o.tx=o.tx*s+dx;o.ty=o.ty*s+dy;}
    if(o.rx!=null){o.rx*=s;o.ry*=s;}
    if(o.w!=null&&o.type!=='map'){o.w*=s;o.h*=s;}
    if(o.mul!=null)o.mul*=k;
    if(o.type==='photo')o.img=await loadImage(o.src);
    objs.push(o);
  }
  objects=objs;
}
function migrate(o){
  if(o.mul==null){
    if(isPoly(o.type)||o.type==='ellipse')o.mul=(o.width||base)/base;
    else if(o.type==='text')o.mul=(o.size||base*3.2)/(base*3.2);
    else if(o.type!=='photo'&&o.type!=='map')o.mul=1;
  }
  if(o.alpha==null)o.alpha=1;
  if(o.type==='line'&&!o.dash)o.dash='solid';
  if(o.type==='photo'&&!o.mode)o.mode='num';
  delete o.width; delete o.size;
  return o;
}

/* ---------- 貼り付け・ドロップ ---------- */
window.addEventListener('paste',async e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const it of items){
    if(it.type&&it.type.indexOf('image/')===0){
      e.preventDefault();
      const src=await fileToDataURL(it.getAsFile());
      if(pasteTarget==='tray')await addTrayPhoto(src);
      else await incomingImage(src);
      return;
    }
  }
});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',async e=>{
  e.preventDefault();
  const fs=Array.prototype.slice.call(e.dataTransfer.files||[]).filter(f=>f.type.indexOf('image/')===0);
  if(!fs.length)return;
  const onSide=document.getElementById('side').contains(e.target);
  for(const f of fs){
    const src=await fileToDataURL(f);
    if(onSide)await addTrayPhoto(src,fs.length===1);
    else if(!getMap())await loadMapWithConfirm(src);
    else if(fs.length===1)await incomingImage(src);
    else await addTrayPhoto(src,false);
  }
});

/* ---------- 表示サイズ ---------- */
function computeFit(){
  const availW=Math.max(stage.clientWidth-24,50), availH=Math.max(stage.clientHeight-24,50);
  fitScale=Math.min(availW/cv.width,availH/cv.height,1);
  if(!(fitScale>0))fitScale=1;
  applyZoom();
}
function applyZoom(){
  const s=scaleNow();
  cv.style.width=Math.round(cv.width*s)+'px';
  cv.style.height=Math.round(cv.height*s)+'px';
}
window.addEventListener('resize',computeFit);

<!-- ---------- パソコン／スマホへのインストール ---------- -->
<script>
(function(){
  /* オフラインでも使えるようにする仕組み。
     ファイルを直接ダブルクリックで開いた場合（file://）は使えないので、その時は何もしません。 */
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){/* 使えなくても動作に支障なし */});
    });
  }

  /* 「パソコンに入れる」ボタン。
     ブラウザが「インストールできますよ」と教えてくれた時だけ出します。 */
  var grp=document.getElementById('grpInstall'),
      btn=document.getElementById('btnInstall'),
      waiting=null;

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();          // ブラウザ既定の案内を止めて、こちらのボタンで出す
    waiting=e;
    grp.hidden=false;
  });

  btn.addEventListener('click',async function(){
    if(!waiting)return;
    grp.hidden=true;
    var p=waiting; waiting=null;
    p.prompt();
    var r=await p.userChoice.catch(function(){return {outcome:'dismissed'}});
    if(r.outcome!=='accepted')grp.hidden=false;   // 断られたら、また押せるように戻す
  });

  window.addEventListener('appinstalled',function(){
    waiting=null;
    grp.hidden=true;
  });
})();
</script>
